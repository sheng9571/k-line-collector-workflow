name: Crypto Daily Collection

on:
  schedule:
    # UTC 02:04 daily - after Binance daily data is finalized
    - cron: '4 2 * * *'
  workflow_dispatch:

concurrency:
  group: crypto-daily
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Required to delete old caches

    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Clone collector repo
        run: git clone --depth 1 https://x-access-token:${{ secrets.K_LINE_COLLECTOR_PAT }}@github.com/sheng9571/k-line-collector.git

      - name: Restore last_ts cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cache
          key: crypto-last-ts-${{ github.run_id }}
          restore-keys: |
            crypto-last-ts-

      - name: Create directories
        run: |
          mkdir -p /tmp/cache /tmp/output
          chmod 777 /tmp/cache /tmp/output

      - name: Run daily collection
        run: |
          docker run --rm \
            -e HF_TOKEN_CRYPTO=${{ secrets.HF_TOKEN_CRYPTO }} \
            -e HF_REPO_CRYPTO=${{ secrets.HF_REPO_CRYPTO }} \
            -e LAST_TS_CACHE_PATH=/app/cache/last_ts.json \
            -e LAST_TS_OUTPUT_PATH=/app/output/last_ts.json \
            -v ${{ github.workspace }}/k-line-collector/common:/app/common:ro \
            -v ${{ github.workspace }}/k-line-collector/crypto:/app/crypto:ro \
            -v /tmp/cache:/app/cache:ro \
            -v /tmp/output:/app/output \
            ghcr.io/${{ github.repository_owner }}/k-line-collector:latest \
            crypto daily

      - name: Copy output to cache dir for next run
        run: |
          if [ -f /tmp/output/last_ts.json ]; then
            cp /tmp/output/last_ts.json /tmp/cache/last_ts.json
          fi
        if: always()

      - name: Delete old caches
        run: |
          gh cache list --key crypto-last-ts- --json id --jq '.[].id' \
            | xargs -r -I{} gh cache delete {}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()

      - name: Save last_ts cache
        uses: actions/cache/save@v4
        with:
          path: /tmp/cache
          key: crypto-last-ts-${{ github.run_id }}
        if: always()

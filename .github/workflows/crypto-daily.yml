name: Crypto Daily Collection

on:
  schedule:
    # UTC 02:04 daily - after Binance daily data is finalized
    - cron: '4 2 * * *'
  workflow_dispatch:

concurrency:
  group: crypto-daily
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Clone collector repo
        run: git clone --depth 1 https://x-access-token:${{ secrets.K_LINE_COLLECTOR_PAT }}@github.com/sheng9571/k-line-collector.git

      - name: Download last_ts cache
        uses: actions/download-artifact@v4
        with:
          name: crypto-last-ts
          path: /tmp/cache
        continue-on-error: true  # First run or expired artifact

      - name: Create output directory
        run: mkdir -p /tmp/output

      - name: Run daily collection
        run: |
          docker run --rm \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -e LAST_TS_CACHE_PATH=/app/cache/last_ts.json \
            -e LAST_TS_OUTPUT_PATH=/app/output/last_ts.json \
            -v ${{ github.workspace }}/k-line-collector/common:/app/common:ro \
            -v ${{ github.workspace }}/k-line-collector/crypto:/app/crypto:ro \
            -v /tmp/cache:/app/cache:ro \
            -v /tmp/output:/app/output \
            ghcr.io/${{ github.repository_owner }}/k-line-collector:latest \
            crypto daily

      - name: Upload last_ts cache
        uses: actions/upload-artifact@v4
        with:
          name: crypto-last-ts
          path: /tmp/output/last_ts.json
          retention-days: 5
          overwrite: true
        if: always()  # Upload even if collection had errors

name: Forex Test Linux - MT5 Docker

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'Minutes to keep runner alive for noVNC access'
        required: false
        default: '45'
      broker:
        description: 'Broker to use (empty = all brokers)'
        required: false
        default: ''

jobs:
  test-mt5-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ============================================================
      # Free disk space
      # ============================================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af || true
          docker builder prune -af || true
          df -h
          docker system df || true

      # ============================================================
      # Checkout workflow repo
      # ============================================================

      - name: Checkout workflow repo
        uses: actions/checkout@v4

      # ============================================================
      # Clone collector repo (for volume mounts)
      # ============================================================

      - name: Clone collector repo
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.K_LINE_COLLECTOR_PAT }}@github.com/sheng9571/k-line-collector.git \
            collector

      # ============================================================
      # Login to ghcr.io and pull image
      # ============================================================

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull Docker image
        run: |
          docker pull ghcr.io/sheng9571/k-line-collector/forex-mt5:latest
          docker tag ghcr.io/sheng9571/k-line-collector/forex-mt5:latest forex-mt5:latest

      # ============================================================
      # Start container
      # ============================================================

      - name: Start container
        run: |
          docker run -d \
            --name mt5-test \
            --shm-size=1g \
            --dns 8.8.8.8 \
            --dns 8.8.4.4 \
            -p 6080:6080 \
            -e DISPLAY=:99 \
            -e RUN_MODE=interactive \
            -e MT5_BROKER=${{ inputs.broker }} \
            -e SOPS_AGE_KEY=${{ secrets.SOPS_AGE_KEY }} \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -e FALLBACK_REPO_OWNER=${{ github.repository_owner }} \
            -v ${{ github.workspace }}/collector/forex/credentials.enc.yaml:/opt/forex/credentials.enc.yaml:ro \
            -v ${{ github.workspace }}/collector/forex/brokers.yaml:/opt/forex/brokers.yaml:ro \
            -v ${{ github.workspace }}/collector/forex/src:/opt/forex/src:ro \
            forex-mt5:latest

          echo "Container started. Waiting for noVNC..."
          sleep 10

          # Verify noVNC is responding
          for i in $(seq 1 24); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:6080/vnc.html | grep -q "200"; then
              echo "noVNC is ready!"
              break
            fi
            echo "Waiting for noVNC... attempt $i/24"
            sleep 10
          done

      # ============================================================
      # Cloudflare tunnel + OTS
      # ============================================================

      - name: Download cloudflared
        run: |
          wget -q "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          echo "cloudflared downloaded"

      - name: Start Cloudflare tunnel
        run: |
          /tmp/cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          # Wait for tunnel URL
          TUNNEL_URL=""
          for i in $(seq 1 20); do
            sleep 3
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Cloudflare tunnel URL not detected"
            cat /tmp/cloudflared.log
            exit 1
          fi

          NOVNC_URL="${TUNNEL_URL}/vnc.html"
          echo "NOVNC_URL=$NOVNC_URL" >> $GITHUB_ENV

      - name: Publish noVNC URL via OneTimeSecret
        env:
          OTS_USERNAME: ${{ secrets.OTS_USERNAME }}
          OTS_API_KEY: ${{ secrets.OTS_API_KEY }}
          OTS_PASSPHRASE: ${{ secrets.OTS_PASSPHRASE }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -u "${OTS_USERNAME}:${OTS_API_KEY}" \
            -d "secret=$NOVNC_URL" \
            -d "passphrase=$OTS_PASSPHRASE" \
            -d "ttl=1800" \
            https://eu.onetimesecret.com/api/v1/share)

          SECRET_KEY=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('secret_key',''))" 2>/dev/null || echo "")

          if [ -z "$SECRET_KEY" ]; then
            echo "::error::Failed to create OTS secret. secret_key is empty."
            echo "::error::Check OTS_USERNAME and OTS_API_KEY secrets."
            exit 1
          fi

          # Detect OTS domain from API response (eu vs global)
          OTS_DOMAIN=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          url = data.get('metadata_url', '')
          if 'eu.onetimesecret.com' in url:
              print('eu.onetimesecret.com')
          else:
              print('onetimesecret.com')
          " 2>/dev/null || echo "onetimesecret.com")

          OTS_LINK="https://${OTS_DOMAIN}/secret/$SECRET_KEY"

          echo ""
          echo "========================================================"
          echo " noVNC ACCESS (via OneTimeSecret)"
          echo "========================================================"
          echo ""
          echo " OTS Link: $OTS_LINK"
          echo " Passphrase: (your OTS_PASSPHRASE secret)"
          echo ""
          echo " Open the OTS link, enter passphrase, get noVNC URL."
          echo " Then open the noVNC URL in your browser."
          echo ""
          echo " Credentials are auto-decrypted from SOPS."
          echo "========================================================"

      # ============================================================
      # Test MT5 connections
      # ============================================================

      - name: Test MT5 connections
        run: |
          echo "Waiting for container services to start..."
          sleep 30  # Wait for Xvfb and VNC to start

          # Verify MT5 terminals are pre-installed (build time)
          echo "Verifying MT5 installation..."
          docker exec mt5-test bash -c '
            echo "Python version:"
            wine /root/.wine/drive_c/Python312/python.exe --version

            echo ""
            echo "MT5 Terminals:"
            for broker in metaquotes pepperstone capitalcom; do
              if [ -f "/opt/mt5/${broker}/terminal-unix-path" ]; then
                echo "  $broker: $(cat /opt/mt5/${broker}/terminal-unix-path)"
              else
                echo "  $broker: NOT FOUND"
              fi
            done
          '

          # Check if test script exists
          if ! docker exec mt5-test test -f /opt/forex/src/test_mt5.py 2>/dev/null; then
            echo "::warning::test_mt5.py not found, skipping MT5 connection test"
            exit 0
          fi

          echo ""
          echo "Running MT5 connection tests..."

          # Run test with:
          # 1. source decrypt-credentials.sh to get MT5_*_LOGIN/PASSWORD env vars
          # 2. wine to execute Windows Python
          docker exec mt5-test bash -c '
            source /usr/local/bin/decrypt-credentials.sh
            wine /root/.wine/drive_c/Python312/python.exe "Z:\\opt\\forex\\src\\test_mt5.py"
            wineserver -k || true
          ' || true

          # Copy test results
          docker cp mt5-test:/tmp/test_mt5_results.json ./test_results.json 2>/dev/null || true

          if [ -f ./test_results.json ]; then
            echo ""
            echo "=== Test Results ==="
            cat ./test_results.json
          else
            echo "::warning::test_results.json not found"
          fi

      # ============================================================
      # Keep alive
      # ============================================================

      - name: Keep alive
        run: |
          MINUTES=${{ inputs.keep_alive_minutes }}
          echo "Keeping runner alive for $MINUTES minutes..."
          echo "Container logs (last 50 lines):"
          docker logs mt5-test --tail 50 2>&1 || true
          echo ""
          echo "You can now connect via noVNC."
          sleep $((MINUTES * 60))
          echo "Keep alive timeout reached."

      # ============================================================
      # Cleanup
      # ============================================================

      - name: Container logs
        if: always()
        run: |
          docker logs mt5-test > /tmp/container-stdout.log 2> /tmp/container-stderr.log || true
          echo "=== Container stdout (last 100) ==="
          tail -100 /tmp/container-stdout.log
          echo ""
          echo "=== Container stderr (last 100) ==="
          tail -100 /tmp/container-stderr.log

      - name: Capture screenshots
        if: always()
        run: |
          mkdir -p /tmp/final-screenshots

          docker exec mt5-test bash -c \
            'for i in 1 2 3; do
              import -window root /tmp/screenshot-$i.png 2>/dev/null || true
              sleep 2
            done' || true

          docker cp mt5-test:/tmp/screenshot-1.png /tmp/final-screenshots/ 2>/dev/null || true
          docker cp mt5-test:/tmp/screenshot-2.png /tmp/final-screenshots/ 2>/dev/null || true
          docker cp mt5-test:/tmp/screenshot-3.png /tmp/final-screenshots/ 2>/dev/null || true

          COUNT=$(ls /tmp/final-screenshots/*.png 2>/dev/null | wc -l)
          echo "Screenshots captured: $COUNT"

      - name: Stop container
        if: always()
        run: |
          docker stop mt5-test 2>/dev/null || true
          docker rm mt5-test 2>/dev/null || true

          # Stop cloudflared
          if [ -f /tmp/cloudflared.pid ]; then
            kill $(cat /tmp/cloudflared.pid) 2>/dev/null || true
          fi

      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-test-logs
          path: |
            /tmp/final-screenshots
            /tmp/container-stdout.log
            /tmp/container-stderr.log
            /tmp/cloudflared.log
            ./test_results.json
          if-no-files-found: warn
          retention-days: 3

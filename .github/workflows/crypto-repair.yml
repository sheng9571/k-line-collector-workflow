name: Crypto Repair

on:
  workflow_call:
    inputs:
      symbols:
        description: 'Symbols to repair (comma-separated, or leave empty for all)'
        required: false
        type: string
        default: ''
      timeframes:
        description: 'Timeframes to repair (comma-separated, or leave empty for all)'
        required: false
        type: string
        default: ''
    secrets:
      GHCR_PAT:
        required: true
      K_LINE_COLLECTOR_PAT:
        required: true
      HF_TOKEN_CRYPTO:
        required: true

  workflow_dispatch:
    inputs:
      symbols:
        description: 'Symbols to repair (comma-separated, or leave empty for all)'
        required: false
        default: ''
      timeframes:
        description: 'Timeframes to repair (comma-separated, or leave empty for all)'
        required: false
        default: ''

concurrency:
  group: crypto-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Clone collector repo
        run: git clone --depth 1 https://x-access-token:${{ secrets.K_LINE_COLLECTOR_PAT }}@github.com/sheng9571/k-line-collector.git

      - name: Run repair
        run: |
          mkdir -p /tmp/repair-output
          chmod -R 777 /tmp/repair-output

          # Build CLI args (symbols and timeframes are optional)
          CLI_ARGS=""
          
          if [ -n "${{ inputs.symbols }}" ]; then
            CLI_ARGS="$CLI_ARGS --symbols ${{ inputs.symbols }}"
          fi
          
          if [ -n "${{ inputs.timeframes }}" ]; then
            CLI_ARGS="$CLI_ARGS --timeframes ${{ inputs.timeframes }}"
          fi

          echo "Running: crypto repair $CLI_ARGS"

          docker run --rm \
            -e HF_TOKEN_CRYPTO=${{ secrets.HF_TOKEN_CRYPTO }} \
            -e HF_REPO_CRYPTO=${{ secrets.HF_REPO_CRYPTO }} \
            -e AUDIT_JSON_PATH=/app/audit/audit.json \
            -v /tmp/repair-output:/app/data \
            -v ${{ github.workspace }}/reports/crypto:/app/audit:ro \
            -v ${{ github.workspace }}/k-line-collector/common:/app/common:ro \
            -v ${{ github.workspace }}/k-line-collector/crypto:/app/crypto:ro \
            ghcr.io/${{ github.repository_owner }}/k-line-collector:latest \
            crypto repair $CLI_ARGS

      - name: Show repair report
        if: always()
        run: |
          if [ -f /tmp/repair-output/repair_report.json ]; then
            echo "=== Repair Report ==="
            cat /tmp/repair-output/repair_report.json
          else
            echo "No repair report generated."
          fi

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-report
          path: /tmp/repair-output/repair_report.json
          if-no-files-found: ignore

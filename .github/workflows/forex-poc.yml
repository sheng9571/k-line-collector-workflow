name: Forex PoC (MT5 Wine + noVNC)

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'Minutes to keep runner alive for noVNC access'
        required: false
        default: '45'

jobs:
  mt5-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout mt5-local-test
        uses: actions/checkout@v4
        with:
          repository: sheng9571/k-line-collector
          token: ${{ secrets.K_LINE_COLLECTOR_PAT }}
          sparse-checkout: mt5-local-test
          path: collector

      - name: Generate t5.py with secrets
        run: |
          cat > /tmp/t5.py << 'PYTHON'
          from datetime import datetime, timezone
          import os
          import sys
          import time

          import MetaTrader5 as mt5

          MT5_PATH = r"C:\Program Files\MetaTrader 5\terminal64.exe"

          LOGIN = int(os.environ["MT5_LOGIN"])
          PASSWORD = os.environ["MT5_PASSWORD"]
          SERVER = os.environ["MT5_SERVER"]

          SYMBOL = "GBPJPY"
          REQUEST_SIZES = (100000, 90000, 80000, 70000, 60000, 50000, 10000, 5000, 3000, 2000, 1500, 1000, 500, 100, 10)
          MAX_RETRIES = 3
          RETRY_SECONDS = 1


          def format_time(timestamp):
              return datetime.fromtimestamp(timestamp, tz=timezone.utc).strftime("%Y-%m-%d %H:%M:%S")


          def connect_mt5():
              if not mt5.initialize(
                  path=MT5_PATH,
                  login=LOGIN,
                  password=PASSWORD,
                  server=SERVER,
                  timeout=60_000,
              ):
                  raise RuntimeError(f"initialize failed: {mt5.last_error()}")

              account = mt5.account_info()
              if account is None:
                  raise RuntimeError(f"account_info failed: {mt5.last_error()}")

              terminal = mt5.terminal_info()
              if terminal is None:
                  raise RuntimeError(f"terminal_info failed: {mt5.last_error()}")

              print(f"Login successful: login={account.login}, server={account.server}", file=sys.stderr)
              print(f"Terminal connected={terminal.connected}", file=sys.stderr)


          def prepare_symbol(symbol):
              info = mt5.symbol_info(symbol)
              if info is None:
                  raise RuntimeError(f"symbol_info({symbol}) failed: {mt5.last_error()}")

              if not mt5.symbol_select(symbol, True):
                  raise RuntimeError(f"symbol_select({symbol}) failed: {mt5.last_error()}")

              tick = mt5.symbol_info_tick(symbol)
              if tick is None:
                  raise RuntimeError(f"symbol_info_tick({symbol}) failed: {mt5.last_error()}")

              print(f"Tick OK: bid={tick.bid}, ask={tick.ask}", file=sys.stderr)


          def request_rates(symbol, count):
              for attempt in range(1, MAX_RETRIES + 1):
                  rates = mt5.copy_rates_from_pos(symbol, mt5.TIMEFRAME_M1, 0, count)
                  if rates is not None and len(rates) > 0:
                      return rates
                  print(f"Request failed: count={count}, attempt={attempt}/{MAX_RETRIES}, error={mt5.last_error()}", file=sys.stderr)
                  time.sleep(RETRY_SECONDS)
              return None


          def get_bars(symbol):
              for count in REQUEST_SIZES:
                  print(f"Trying {count} bars...", file=sys.stderr)
                  rates = request_rates(symbol, count)
                  if rates is not None:
                      print(f"Got {len(rates)} bars (requested {count})", file=sys.stderr)
                      return rates
              raise RuntimeError(f"All requests failed. Last error: {mt5.last_error()}")


          def print_bars(rates):
              print(f"{'time':<20}{'open':>12}{'high':>12}{'low':>12}{'close':>12}")
              print("-" * 68)
              for rate in rates[-10:]:
                  print(f"{format_time(rate['time']):<20}{rate['open']:>12.5f}{rate['high']:>12.5f}{rate['low']:>12.5f}{rate['close']:>12.5f}")
              print("-" * 68)
              print(f"Total bars: {len(rates)}")


          def main():
              try:
                  connect_mt5()
                  prepare_symbol(SYMBOL)
                  rates = get_bars(SYMBOL)
                  print_bars(rates)
                  return 0
              except Exception as e:
                  print(f"Error: {e}", file=sys.stderr)
                  return 1
              finally:
                  mt5.shutdown()


          if __name__ == "__main__":
              raise SystemExit(main())
          PYTHON

          echo "t5.py generated (uses env vars for credentials)"

      - name: Prepare xterm auto-respawn script
        run: |
          cat > /tmp/xterm-loop.sh << 'SCRIPT'
          #!/bin/sh
          sleep 5
          while true; do
            if ! pgrep -x xterm >/dev/null; then
              xterm -geometry 120x30+0+0 &
              sleep 2
              wmctrl -r xterm -b add,above 2>/dev/null || true
            fi
            sleep 3
          done
          SCRIPT
          chmod +x /tmp/xterm-loop.sh
          echo "xterm auto-respawn script ready"

      - name: Build Docker image
        working-directory: collector/mt5-local-test
        run: |
          docker build -t mt5-poc .

      - name: Start container
        run: |
          docker run -d \
            --name mt5-poc \
            --shm-size=1g \
            -p 6080:6080 \
            -e DISPLAY=:99 \
            -e MT5_LOGIN=${{ secrets.MT5_LOGIN }} \
            -e MT5_PASSWORD=${{ secrets.MT5_PASSWORD }} \
            -e MT5_SERVER=${{ secrets.MT5_SERVER }} \
            -v /tmp/t5.py:/opt/t5-secrets.py:ro \
            -v /tmp/xterm-loop.sh:/usr/local/bin/xterm-loop.sh:ro \
            mt5-poc

          echo "Container started. Waiting for noVNC..."
          sleep 10

          # Install xterm inside container (not in base image)
          docker exec mt5-poc apt-get update -qq
          docker exec mt5-poc apt-get install -y -qq xterm

          # Start xterm loop inside container
          docker exec -d mt5-poc /usr/local/bin/xterm-loop.sh

          # Verify noVNC is responding
          for i in $(seq 1 12); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:6080/vnc.html | grep -q "200"; then
              echo "noVNC is ready!"
              break
            fi
            echo "Waiting for noVNC... attempt $i/12"
            sleep 5
          done

      - name: Download cloudflared
        run: |
          wget -q "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          echo "cloudflared downloaded"

      - name: Start Cloudflare tunnel
        run: |
          /tmp/cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          # Wait for tunnel URL
          TUNNEL_URL=""
          for i in $(seq 1 20); do
            sleep 3
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Cloudflare tunnel URL not detected"
            cat /tmp/cloudflared.log
            exit 1
          fi

          NOVNC_URL="${TUNNEL_URL}/vnc.html"
          echo "NOVNC_URL=$NOVNC_URL" >> $GITHUB_ENV
          echo "Tunnel URL: $NOVNC_URL"

      - name: Publish noVNC URL via OneTimeSecret
        env:
          OTS_USERNAME: ${{ secrets.OTS_USERNAME }}
          OTS_API_KEY: ${{ secrets.OTS_API_KEY }}
          OTS_PASSPHRASE: ${{ secrets.OTS_PASSPHRASE }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -u "${OTS_USERNAME}:${OTS_API_KEY}" \
            -d "secret=$NOVNC_URL" \
            -d "passphrase=$OTS_PASSPHRASE" \
            -d "ttl=1800" \
            https://onetimesecret.com/api/v1/share)

          SECRET_KEY=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('secret_key',''))")

          if [ -z "$SECRET_KEY" ]; then
            echo "::error::Failed to create OTS secret"
            echo "$RESPONSE"
            exit 1
          fi

          OTS_LINK="https://onetimesecret.com/secret/$SECRET_KEY"

          echo ""
          echo "========================================================"
          echo " noVNC ACCESS (via OneTimeSecret)"
          echo "========================================================"
          echo ""
          echo " OTS Link: $OTS_LINK"
          echo " Passphrase: (your OTS_PASSPHRASE secret)"
          echo ""
          echo " Open the OTS link, enter passphrase, get noVNC URL."
          echo " Then open the noVNC URL in your browser."
          echo ""
          echo " Inside noVNC, use xterm to run:"
          echo "   wine /root/.wine/drive_c/Python312/python.exe /opt/t5-secrets.py"
          echo ""
          echo "========================================================"

      - name: Keep alive
        run: |
          MINUTES=${{ inputs.keep_alive_minutes }}
          echo "Keeping runner alive for $MINUTES minutes..."
          echo "Container logs (last 50 lines):"
          docker logs mt5-poc --tail 50 2>&1 || true
          echo ""
          echo "You can now connect via noVNC and run t5.py manually."
          sleep $((MINUTES * 60))
          echo "Keep alive timeout reached."

      - name: Capture final screenshots
        if: always()
        run: |
          mkdir -p /tmp/final-screenshots

          # Try to capture from Xvfb inside container
          docker exec mt5-poc bash -c \
            'for i in 1 2 3; do
              import -window root /opt/test/screenshot-$i.png 2>/dev/null || true
              sleep 2
            done' || true

          # Copy screenshots out
          docker cp mt5-poc:/opt/test/. /tmp/final-screenshots/ 2>/dev/null || true

          COUNT=$(ls /tmp/final-screenshots/*.png 2>/dev/null | wc -l)
          echo "Screenshots captured: $COUNT"

      - name: Container logs
        if: always()
        run: |
          docker logs mt5-poc > /tmp/container-stdout.log 2> /tmp/container-stderr.log || true
          echo "=== Container stdout (last 100) ==="
          tail -100 /tmp/container-stdout.log
          echo ""
          echo "=== Container stderr (last 100) ==="
          tail -100 /tmp/container-stderr.log

      - name: Stop container
        if: always()
        run: |
          docker stop mt5-poc 2>/dev/null || true
          docker rm mt5-poc 2>/dev/null || true

          # Stop cloudflared
          if [ -f /tmp/cloudflared.pid ]; then
            kill $(cat /tmp/cloudflared.pid) 2>/dev/null || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-poc-logs
          path: |
            /tmp/final-screenshots
            /tmp/container-stdout.log
            /tmp/container-stderr.log
            /tmp/cloudflared.log
          if-no-files-found: warn
          retention-days: 3

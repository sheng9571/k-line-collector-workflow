name: TV Symbol Check

# Validates all symbols in a TV symbol list against TradingView.
# Collects full chart.infos for each symbol and commits tv.json to
# reports/{category}/symbols/tv.json via PR with auto-merge.
#
# Exit code: 1 (run turns red) if any symbol is not_found or timeout.
# The PR/commit still runs even on validation failure so results are preserved.
#
# Run manually or weekly on Sunday 07:00 UTC.

on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      config_file:
        description: 'TV config file (relative to tv/ in collector repo)'
        required: false
        default: 'config/forex.yaml'
        type: choice
        options:
          - config/forex.yaml
          - config/crypto.yaml
          - config/stock.yaml

concurrency:
  group: tv-symbol-check-${{ inputs.config_file || 'config/forex.yaml' }}
  cancel-in-progress: false

jobs:
  check-symbols:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # ============================================================
      # Free disk space
      # ============================================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h

      # ============================================================
      # Checkout workflow repo
      # ============================================================
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      # ============================================================
      # Clone collector repo (for config/ and symbol lists)
      # ============================================================
      - name: Clone collector repo
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.K_LINE_COLLECTOR_PAT }}@github.com/sheng9571/k-line-collector.git \
            collector

      # ============================================================
      # Login to ghcr.io and pull image
      # ============================================================
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull Docker image
        run: |
          docker pull ghcr.io/sheng9571/k-line-collector/tv-collector:latest
          docker tag  ghcr.io/sheng9571/k-line-collector/tv-collector:latest tv-collector:latest

      # ============================================================
      # Start container
      # ============================================================
      - name: Start container
        run: |
          mkdir -p output

          docker run -d \
            --name tv-collector \
            -e NODE_ENV=production \
            -e SKIP_HF_UPLOAD=true \
            -e TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }} \
            -e TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }} \
            -e TV_SESSION=${{ secrets.TV_SESSION }} \
            -e TV_SIGNATURE=${{ secrets.TV_SIGNATURE }} \
            -e OUTPUT_DIR=/app/output \
            -v ${{ github.workspace }}/collector/forex/symbols:/forex/symbols:ro \
            -v ${{ github.workspace }}/collector/crypto/symbols:/crypto/symbols:ro \
            -v ${{ github.workspace }}/collector/stock/symbols:/stock/symbols:ro \
            -v ${{ github.workspace }}/output:/app/output \
            tv-collector:latest \
            tail -f /dev/null

          echo "Container started"

      # ============================================================
      # Copy config into container
      # ============================================================
      - name: Copy config into container
        run: |
          CONFIG_FILE="${{ inputs.config_file || 'config/forex.yaml' }}"
          CONFIG_SRC="./collector/tv/${CONFIG_FILE}"

          if [ ! -f "${CONFIG_SRC}" ]; then
            echo "ERROR: config file not found: ${CONFIG_SRC}"
            exit 1
          fi

          docker exec tv-collector mkdir -p "/app/$(dirname "${CONFIG_FILE}")"
          docker cp "${CONFIG_SRC}" "tv-collector:/app/${CONFIG_FILE}"
          echo "Config copied: ${CONFIG_FILE}"

      # ============================================================
      # Run symbol check
      # ============================================================
      - name: Run symbol check
        id: symbol_check
        continue-on-error: true
        run: |
          CONFIG_FILE="${{ inputs.config_file || 'config/forex.yaml' }}"

          echo "Running symbol-check for ${CONFIG_FILE} ..."
          docker exec tv-collector sh -c "node src/main.js --mode symbol-check --config ${CONFIG_FILE}"

          # Capture exit code
          SYMBOL_CHECK_EXIT=$?
          echo "exit_code=${SYMBOL_CHECK_EXIT}" >> $GITHUB_OUTPUT
          echo "Symbol check exit code: ${SYMBOL_CHECK_EXIT}"

      # ============================================================
      # Copy results back to host
      # ============================================================
      - name: Copy results from container
        run: |
          docker cp tv-collector:/app/output/. ./output/ 2>/dev/null || true
          echo "Output files:"
          ls -la ./output/ 2>/dev/null || echo "(none)"

      # ============================================================
      # Write tv.json and Job Summary
      # ============================================================
      - name: Write tv.json and Job Summary
        run: |
          CONFIG_FILE="${{ inputs.config_file || 'config/forex.yaml' }}"

          # Derive category and output path from config_file
          case "${CONFIG_FILE}" in
            config/forex.yaml)  CATEGORY="forex"  ;;
            config/crypto.yaml) CATEGORY="crypto" ;;
            config/stock.yaml)  CATEGORY="stock"  ;;
            *)                  CATEGORY="unknown" ;;
          esac

          REPORT_DIR="reports/${CATEGORY}/symbols"
          mkdir -p "${REPORT_DIR}"

          # Copy symbol_check.json → tv.json
          if [ -f "./output/symbol_check.json" ]; then
            cp "./output/symbol_check.json" "${REPORT_DIR}/tv.json"
            echo "tv.json written to ${REPORT_DIR}/tv.json"
          else
            echo "::warning::symbol_check.json not found — tv.json not written"
            echo '{"error":"symbol_check.json not produced"}' > "${REPORT_DIR}/tv.json"
          fi

          # Generate Job Summary using Python3
          python3 - <<'PYEOF'
          import json, os, sys

          report_dir = os.environ.get("REPORT_DIR", "reports/unknown/symbols")
          config_file = os.environ.get("CONFIG_FILE", "unknown")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")

          tv_json = os.path.join(report_dir, "tv.json")
          if not os.path.exists(tv_json):
              with open(summary_path, "a") as f:
                  f.write("## TV Symbol Validation\n\n❌ symbol_check.json not found.\n")
              sys.exit(0)

          with open(tv_json) as f:
              data = json.load(f)

          summary   = data.get("summary", {})
          symbols   = data.get("symbols", [])
          gen_at    = data.get("generated_at", "?")

          found    = [s for s in symbols if s.get("status") == "found"]
          missing  = [s for s in symbols if s.get("status") == "not_found"]
          timeouts = [s for s in symbols if s.get("status") == "timeout"]

          lines = []
          lines.append(f"## TV Symbol Validation — {config_file}\n")
          lines.append(f"**Run:** {gen_at} | **Total:** {summary.get('total', '?')}\n")
          lines.append("")
          lines.append("| Status | Count |")
          lines.append("|--------|-------|")
          lines.append(f"| ✅ Found | {len(found)} |")
          lines.append(f"| ❌ Not found | {len(missing)} |")
          lines.append(f"| ⚠️ Timeout | {len(timeouts)} |")
          lines.append("")

          if missing:
              lines.append(f"### ❌ Not Found ({len(missing)})")
              lines.append("| Symbol | Error |")
              lines.append("|--------|-------|")
              for s in missing:
                  lines.append(f"| `{s['tv_symbol']}` | {s.get('error','?')} |")
              lines.append("")

          if timeouts:
              lines.append(f"### ⚠️ Timeout ({len(timeouts)})")
              lines.append("| Symbol | Error |")
              lines.append("|--------|-------|")
              for s in timeouts:
                  lines.append(f"| `{s['tv_symbol']}` | {s.get('error','?')} |")
              lines.append("")

          if found:
              lines.append(f"### ✅ Found ({len(found)})")
              lines.append("| Symbol | Description | Type | Exchange | Currency | Session |")
              lines.append("|--------|-------------|------|----------|----------|---------|")
              for s in found:
                  info = s.get("info", {})
                  lines.append(
                      f"| `{s['tv_symbol']}` "
                      f"| {info.get('description','?')} "
                      f"| {info.get('type','?')} "
                      f"| {info.get('exchange','?')} "
                      f"| {info.get('currency_code','?')} "
                      f"| {info.get('session','?')} |"
                  )
              lines.append("")

          with open(summary_path, "a") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Job Summary written ({len(lines)} lines)")
          PYEOF
        env:
          REPORT_DIR: "reports/${{ (inputs.config_file == 'config/crypto.yaml' && 'crypto') || (inputs.config_file == 'config/stock.yaml' && 'stock') || 'forex' }}/symbols"
          CONFIG_FILE: "${{ inputs.config_file || 'config/forex.yaml' }}"

      # ============================================================
      # Commit tv.json and open PR with auto-merge
      # ============================================================
      - name: Commit tv.json and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONFIG_FILE="${{ inputs.config_file || 'config/forex.yaml' }}"
          case "${CONFIG_FILE}" in
            config/forex.yaml)  CATEGORY="forex"  ;;
            config/crypto.yaml) CATEGORY="crypto" ;;
            config/stock.yaml)  CATEGORY="stock"  ;;
            *)                  CATEGORY="unknown" ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "reports/${CATEGORY}/symbols/tv.json"

          if git diff --staged --quiet; then
            echo "No changes to tv.json, skipping PR"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="chore/tv-symbol-check-${CATEGORY}-${DATE}-${{ github.run_id }}"

          git checkout -b "${BRANCH}"
          git commit -m "chore(tv): update ${CATEGORY} symbol info ${DATE}"

          # Pull rebase to avoid push conflicts with concurrent runs
          git pull --rebase origin main || true
          git push -u origin "${BRANCH}"

          gh pr create \
            --title "chore(tv): update ${CATEGORY} symbol info ${DATE}" \
            --body "Automated TV symbol check from tv-symbol-check workflow (run ${{ github.run_id }}).

Config: ${CONFIG_FILE}
Found: $(python3 -c "import json; d=json.load(open('reports/${CATEGORY}/symbols/tv.json')); print(d.get('summary',{}).get('found','?'))")
Not found: $(python3 -c "import json; d=json.load(open('reports/${CATEGORY}/symbols/tv.json')); print(d.get('summary',{}).get('not_found','?'))")
Timeout: $(python3 -c "import json; d=json.load(open('reports/${CATEGORY}/symbols/tv.json')); print(d.get('summary',{}).get('timeout','?'))")" \
            --base main \
            --head "${BRANCH}"

          PR_NUMBER=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number')
          if [ -n "${PR_NUMBER}" ]; then
            gh pr merge "${PR_NUMBER}" --auto --squash || \
              echo "::warning::Auto-merge not available; please merge the PR manually."
          fi

      # ============================================================
      # Final exit — fail if any symbol not_found or timeout
      # ============================================================
      - name: Check symbol validation result
        if: always()
        run: |
          EXIT_CODE="${{ steps.symbol_check.outputs.exit_code }}"
          if [ "${EXIT_CODE}" != "0" ] && [ -n "${EXIT_CODE}" ]; then
            echo "::error::Symbol validation failed (exit code ${EXIT_CODE}): some symbols are not_found or timeout."
            exit 1
          fi
          echo "All symbols validated successfully."

      # ============================================================
      # Cleanup
      # ============================================================
      - name: Container logs
        if: always()
        run: |
          docker logs tv-collector 2>&1 | tail -100 || true

      - name: Stop container
        if: always()
        run: |
          docker stop tv-collector 2>/dev/null || true
          docker rm   tv-collector 2>/dev/null || true

name: Forex K-line Daily Collection

on:
  # schedule:
  #   # Monday-Saturday 05:00 UTC+8 = Sunday-Friday 21:00 UTC
  #   - cron: '0 21 * * 0-5'
  workflow_dispatch:
    inputs:
      broker:
        description: 'Broker to collect from'
        required: true
        default: 'pepperstone'
        type: choice
        options:
          - pepperstone
          - capitalcom
          - all
      mode:
        description: 'Collection mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
      symbols:
        description: 'Comma-separated canonical symbols (empty = all)'
        required: false
        default: ''
      timeframes:
        description: 'Comma-separated timeframes (empty = all 15: 1min,3min,5min,10min,15min,30min,1h,2h,4h,6h,8h,12h,D1,W1,M1)'
        required: false
        default: ''
      force_restart:
        description: 'Force restart (ignore existing state, start fresh)'
        required: false
        default: false
        type: boolean
      keep_alive_minutes:
        description: 'Minutes to keep runner alive for debugging'
        required: false
        default: '0'

jobs:
  collect-klines:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    strategy:
      max-parallel: 1
      matrix:
        broker: ${{ fromJSON((github.event_name == 'schedule' || github.event.inputs.broker == 'all') && '["pepperstone","capitalcom"]' || format('["{0}"]', github.event.inputs.broker || 'pepperstone')) }}

    steps:
      # ============================================================
      # Free disk space
      # ============================================================

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af || true
          docker builder prune -af || true
          df -h
          docker system df || true

      # ============================================================
      # Checkout workflow repo
      # ============================================================

      - name: Checkout workflow repo
        uses: actions/checkout@v4

      # ============================================================
      # Clone collector repo (for volume mounts)
      # ============================================================

      - name: Clone collector repo
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.K_LINE_COLLECTOR_PAT }}@github.com/sheng9571/k-line-collector.git \
            collector

      # ============================================================
      # Login to ghcr.io and pull image
      # ============================================================

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull Docker image
        run: |
          docker pull ghcr.io/sheng9571/k-line-collector/forex-mt5:latest
          docker tag ghcr.io/sheng9571/k-line-collector/forex-mt5:latest forex-mt5:latest

      # ============================================================
      # Set parameters
      # ============================================================

      - name: Set collection parameters
        id: params
        run: |
          BROKER="${{ matrix.broker }}"
          MODE="${{ inputs.mode || 'daily' }}"
          SYMBOLS="${{ inputs.symbols }}"
          TIMEFRAMES="${{ inputs.timeframes }}"
          KEEP_ALIVE="${{ inputs.keep_alive_minutes || '0' }}"
          FORCE_RESTART="${{ inputs.force_restart || 'false' }}"

          # Determine state cache key based on mode and whether symbols are specified
          if [ -n "$SYMBOLS" ]; then
            STATE_CACHE_KEY="forex-backfill-state-manually"
          elif [ "$MODE" = "backfill" ]; then
            STATE_CACHE_KEY="forex-backfill-state-${BROKER}"
          else
            STATE_CACHE_KEY="forex-daily-state-${BROKER}"
          fi

          echo "broker=$BROKER" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "symbols=$SYMBOLS" >> $GITHUB_OUTPUT
          echo "timeframes=$TIMEFRAMES" >> $GITHUB_OUTPUT
          echo "keep_alive=$KEEP_ALIVE" >> $GITHUB_OUTPUT
          echo "force_restart=$FORCE_RESTART" >> $GITHUB_OUTPUT
          echo "state_cache_key=$STATE_CACHE_KEY" >> $GITHUB_OUTPUT
          echo "run_started_at=$(date +%s)" >> $GITHUB_OUTPUT

          echo "Collection parameters:"
          echo "  Broker: $BROKER"
          echo "  Mode: $MODE"
          echo "  Symbols: ${SYMBOLS:-all}"
          echo "  Timeframes: ${TIMEFRAMES:-all (15 native MT5)}"
          echo "  Force restart: $FORCE_RESTART"
          echo "  State cache key: $STATE_CACHE_KEY"

      # ============================================================
      # Restore state cache
      # ============================================================

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: ./state
          key: ${{ steps.params.outputs.state_cache_key }}

      # ============================================================
      # Start container
      # ============================================================

      - name: Start container
        run: |
          docker run -d \
            --name forex-collector \
            --shm-size=1g \
            --dns 8.8.8.8 \
            --dns 8.8.4.4 \
            -p 6080:6080 \
            -e DISPLAY=:99 \
            -e RUN_MODE=interactive \
            -e MT5_BROKER=${{ steps.params.outputs.broker }} \
            -e SOPS_AGE_KEY=${{ secrets.SOPS_AGE_KEY }} \
            -e HF_TOKEN_FOREX=${{ secrets.HF_TOKEN_FOREX }} \
            -e HF_REPO_FOREX=${{ secrets.HF_REPO_FOREX }} \
            -e FALLBACK_REPO_OWNER=${{ github.repository_owner }} \
            -e RUN_STARTED_AT=${{ steps.params.outputs.run_started_at }} \
            -v ${{ github.workspace }}/collector/forex/credentials.enc.yaml:/opt/forex/credentials.enc.yaml:ro \
            -v ${{ github.workspace }}/collector/forex/brokers.yaml:/opt/forex/brokers.yaml:ro \
            -v ${{ github.workspace }}/collector/forex/symbol_metadata.yaml:/opt/forex/symbol_metadata.yaml:ro \
            -v ${{ github.workspace }}/collector/forex/symbols:/opt/forex/symbols:ro \
            -v ${{ github.workspace }}/collector/forex/src:/opt/forex/src:ro \
            forex-mt5:latest

          echo "Container started. Waiting for noVNC..."
          sleep 10

          # Verify noVNC is responding
          for i in $(seq 1 24); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:6080/vnc.html | grep -q "200"; then
              echo "noVNC is ready!"
              break
            fi
            echo "Waiting for noVNC... attempt $i/24"
            sleep 10
          done

      # ============================================================
      # Cloudflare tunnel + OTS
      # ============================================================

      - name: Download cloudflared
        run: |
          wget -q "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          echo "cloudflared downloaded"

      - name: Start Cloudflare tunnel
        run: |
          /tmp/cloudflared tunnel --url http://localhost:6080 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          # Wait for tunnel URL
          TUNNEL_URL=""
          for i in $(seq 1 20); do
            sleep 3
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "::error::Cloudflare tunnel URL not detected"
            cat /tmp/cloudflared.log
            exit 1
          fi

          NOVNC_URL="${TUNNEL_URL}/vnc.html"
          echo "NOVNC_URL=$NOVNC_URL" >> $GITHUB_ENV

      - name: Publish noVNC URL via OneTimeSecret
        env:
          OTS_USERNAME: ${{ secrets.OTS_USERNAME }}
          OTS_API_KEY: ${{ secrets.OTS_API_KEY }}
          OTS_PASSPHRASE: ${{ secrets.OTS_PASSPHRASE }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -u "${OTS_USERNAME}:${OTS_API_KEY}" \
            -d "secret=$NOVNC_URL" \
            -d "passphrase=$OTS_PASSPHRASE" \
            -d "ttl=1800" \
            https://eu.onetimesecret.com/api/v1/share)

          SECRET_KEY=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('secret_key',''))" 2>/dev/null || echo "")

          if [ -z "$SECRET_KEY" ]; then
            echo "::error::Failed to create OTS secret. secret_key is empty."
            echo "::error::Check OTS_USERNAME and OTS_API_KEY secrets."
            exit 1
          fi

          # Detect OTS domain from API response (eu vs global)
          OTS_DOMAIN=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          url = data.get('metadata_url', '')
          if 'eu.onetimesecret.com' in url:
              print('eu.onetimesecret.com')
          else:
              print('onetimesecret.com')
          " 2>/dev/null || echo "onetimesecret.com")

          OTS_LINK="https://${OTS_DOMAIN}/secret/$SECRET_KEY"

          echo ""
          echo "========================================================"
          echo " noVNC ACCESS (via OneTimeSecret)"
          echo "========================================================"
          echo ""
          echo " OTS Link: $OTS_LINK"
          echo " Passphrase: (your OTS_PASSPHRASE secret)"
          echo ""
          echo " Open the OTS link, enter passphrase, get noVNC URL."
          echo " Then open the noVNC URL in your browser."
          echo ""
          echo " Credentials are auto-decrypted from SOPS."
          echo "========================================================"

      # ============================================================
      # Export symbols
      # ============================================================

      - name: Export symbols from MT5
        run: |
          BROKER="${{ steps.params.outputs.broker }}"
          
          echo "Waiting for container services to start..."
          sleep 30

          echo "Exporting symbols for broker: $BROKER"
          
          docker exec forex-collector bash -c "
            source /usr/local/bin/decrypt-credentials.sh
            wine /root/.wine/drive_c/Python312/python.exe /opt/forex/src/main.py \
              --broker $BROKER \
              --export-only \
              --symbols-dir /opt/reports/forex/symbols \
              --config-dir /opt/forex
            wineserver -k || true
          " || true

      # ============================================================
      # Copy and commit symbols
      # ============================================================

      - name: Copy symbols from container
        run: |
          mkdir -p reports/forex/symbols
          docker cp forex-collector:/opt/reports/forex/symbols/. ./reports/forex/symbols/ 2>/dev/null || true
          echo "Symbols copied:"
          ls -la reports/forex/symbols/ 2>/dev/null || echo "No symbols found"

      - name: Merge session data into symbols
        run: |
          # Check if merge script exists
          if [ ! -f collector/forex/src/merge_sessions.py ]; then
            echo "::warning::merge_sessions.py not found, skipping session merge"
            exit 0
          fi

          # Check if any session files exist
          SESSION_COUNT=$(ls reports/forex/symbols/*_symbol_sessions_utc.json 2>/dev/null | wc -l)
          if [ "$SESSION_COUNT" -eq 0 ]; then
            echo "No session files found, skipping merge"
            exit 0
          fi

          echo "Found $SESSION_COUNT session file(s), merging..."
          python3 collector/forex/src/merge_sessions.py reports/forex/symbols/

          echo ""
          echo "Merged symbols:"
          ls -la reports/forex/symbols/*.json 2>/dev/null || true

      - name: Commit and push symbols
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add reports/forex/symbols/*.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No new symbols to commit"
          else
            git pull --rebase origin ${{ github.ref_name }} || true
            git commit -m "chore(forex): update ${{ steps.params.outputs.broker }} symbols $(date -u +%Y-%m-%d)"
            git push
            echo "Symbols committed and pushed"
          fi

      # ============================================================
      # Collect K-lines
      # ============================================================

      - name: Collect K-lines
        run: |
          BROKER="${{ steps.params.outputs.broker }}"
          MODE="${{ steps.params.outputs.mode }}"
          SYMBOLS="${{ steps.params.outputs.symbols }}"
          TIMEFRAMES="${{ steps.params.outputs.timeframes }}"
          FORCE_RESTART="${{ steps.params.outputs.force_restart }}"

          # Build command
          CMD="wine /root/.wine/drive_c/Python312/python.exe /opt/forex/src/main.py"
          CMD="$CMD --mode $MODE --broker $BROKER"
          CMD="$CMD --data-dir /opt/data/forex"
          CMD="$CMD --config-dir /opt/forex"
          CMD="$CMD --symbols-dir /opt/reports/forex/symbols"
          CMD="$CMD --skip-symbol-export"
          CMD="$CMD --output-json /opt/data/collection_results.json"
          CMD="$CMD --state-file /opt/data/run_state.json"

          # Daily mode: pass last_ts cache for incremental updates
          if [ "$MODE" = "daily" ]; then
            CMD="$CMD --last-ts-cache /opt/data/last_ts_cache.json"
            CMD="$CMD --last-ts-output /opt/data/last_ts_cache.json"
          fi

          if [ "$FORCE_RESTART" = "true" ]; then
            CMD="$CMD --force-restart"
          fi

          if [ -n "$SYMBOLS" ]; then
            CMD="$CMD --symbols $SYMBOLS"
          fi

          if [ -n "$TIMEFRAMES" ]; then
            CMD="$CMD --timeframes $TIMEFRAMES"
          fi

          # Copy state file into container if it exists
          if [ -f ./state/run_state.json ]; then
            echo "Restoring state from cache..."
            docker exec forex-collector mkdir -p /opt/data
            docker cp ./state/run_state.json forex-collector:/opt/data/run_state.json
          fi

          # Daily mode: restore last_ts cache into container if it exists
          if [ "$MODE" = "daily" ] && [ -f ./state/last_ts_cache.json ]; then
            echo "Restoring last_ts cache from cache..."
            docker exec forex-collector mkdir -p /opt/data
            docker cp ./state/last_ts_cache.json forex-collector:/opt/data/last_ts_cache.json
          fi

          echo "Running: $CMD"

          docker exec forex-collector bash -c "
            source /usr/local/bin/decrypt-credentials.sh
            $CMD
            wineserver -k || true
          " || true

          # Copy results and state (always, even if collection failed)
          mkdir -p ./data ./state
          docker cp forex-collector:/opt/data/. ./data/ 2>/dev/null || true

          # Save state for cache
          if [ -f ./data/run_state.json ]; then
            cp ./data/run_state.json ./state/run_state.json
          fi

          # Daily mode: save last_ts cache for next run
          if [ "$MODE" = "daily" ] && [ -f ./data/last_ts_cache.json ]; then
            cp ./data/last_ts_cache.json ./state/last_ts_cache.json
          fi

          echo ""
          echo "=== Collection Results ==="
          if [ -f ./data/collection_results.json ]; then
            cat ./data/collection_results.json
          else
            echo "No results file found"
          fi

          # Check if needs_more
          NEEDS_MORE=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('./data/collection_results.json'))
              print('true' if d.get('needs_more') else 'false')
          except:
              print('false')
          " 2>/dev/null || echo "false")
          echo "needs_more=$NEEDS_MORE" >> $GITHUB_OUTPUT

          # Re-exit with error if collection failed (after outputs are written)
          if [ -f ./data/collection_results.json ]; then
            ERRORS=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('./data/collection_results.json'))
              print(d.get('summary', {}).get('errors', 0))
          except:
              print(0)
          " 2>/dev/null || echo "0")
            if [ "$ERRORS" -gt "0" ]; then
              echo "Collection completed with $ERRORS error(s)"
              exit 1
            fi
          fi
        id: collect

      # ============================================================
      # Save state cache
      # ============================================================

      - name: Delete old state cache
        if: ${{ always() }}
        run: gh cache delete ${{ steps.params.outputs.state_cache_key }} || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Save state cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ./state
          key: ${{ steps.params.outputs.state_cache_key }}

      # ============================================================
      # Trigger next run if needed
      # ============================================================

      - name: Trigger next run
        if: ${{ always() && steps.collect.outputs.needs_more == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Time limit reached, triggering next run..."
          sleep 30
          gh workflow run forex-kline-daily.yml \
            --repo ${{ github.repository }} \
            --ref main \
            --field broker=${{ steps.params.outputs.broker }} \
            --field mode=${{ steps.params.outputs.mode }} \
            --field symbols="${{ steps.params.outputs.symbols }}" \
            --field timeframes="${{ steps.params.outputs.timeframes }}" \
            --field force_restart=false \
            --field keep_alive_minutes=0

      - name: Clear manually state on completion
        # When manual single-symbol run completes with no more work, overwrite state with empty
        if: ${{ always() && inputs.symbols != '' && steps.collect.outputs.needs_more == 'false' }}
        run: |
          mkdir -p ./state
          echo '{"version":"1","completed":true,"symbols_todo":[],"symbols_done":[],"symbols_failed":[]}' > ./state/run_state.json
          echo "Manual run complete, cleared forex-backfill-state-manually"

      # ============================================================
      # Keep alive (optional)
      # ============================================================

      - name: Keep alive
        if: ${{ steps.params.outputs.keep_alive != '0' }}
        run: |
          MINUTES=${{ steps.params.outputs.keep_alive }}
          echo "Keeping runner alive for $MINUTES minutes..."
          echo "Container logs (last 50 lines):"
          docker logs forex-collector --tail 50 2>&1 || true
          echo ""
          echo "You can now connect via noVNC."
          sleep $((MINUTES * 60))
          echo "Keep alive timeout reached."

      # ============================================================
      # Cleanup
      # ============================================================

      - name: Container logs
        if: always()
        run: |
          docker logs forex-collector > /tmp/container-stdout.log 2> /tmp/container-stderr.log || true
          echo "=== Container stdout (last 100) ==="
          tail -100 /tmp/container-stdout.log
          echo ""
          echo "=== Container stderr (last 100) ==="
          tail -100 /tmp/container-stderr.log

      - name: Stop container
        if: always()
        run: |
          docker stop forex-collector 2>/dev/null || true
          docker rm forex-collector 2>/dev/null || true

          # Stop cloudflared
          if [ -f /tmp/cloudflared.pid ]; then
            kill $(cat /tmp/cloudflared.pid) 2>/dev/null || true
          fi
